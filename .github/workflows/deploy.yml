name: Deploy Zoiko Tax Website

concurrency:
  group: deploy-zoiko-tax
  cancel-in-progress: false

on:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `LayoutProps<...>`/`PageProps<...>` etc. are ambient types Next.js
      # generates into .next/types/ - they don't exist on a fresh checkout,
      # so tsc needs this first or it falsely reports them as undefined.
      - run: npx next typegen
      - run: npx tsc --noEmit

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          # Default command_timeout is 10m, which `git pull` + `npm install`
          # + `npm run build` can exceed on a small/shared-core deploy VM.
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/zoiko-tax/app
            git pull origin main
            npm install
            npm run build
            pm2 restart zoiko-tax
            pm2 save
