name: Deploy Zoiko Tax Website

concurrency:
  group: deploy-zoiko-tax
  cancel-in-progress: false

on:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            export NODE_OPTIONS=--max-old-space-size=1536
            cd /var/www/zoiko-tax/app
            git pull origin main
            npm install
            npm run build
            pm2 restart zoiko-tax
            pm2 save
