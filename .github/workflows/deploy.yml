name: Deploy Zoiko Tax Website

concurrency:
  group: deploy-zoiko-tax
  cancel-in-progress: false

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generates LayoutProps / PageProps / route types that tsc needs on a clean checkout
      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            export NODE_OPTIONS=--max-old-space-size=1536
            cd /var/www/zoiko-tax/app
            git pull origin main
            npm install
            npm run build
            pm2 restart zoiko-tax || pm2 start npm --name zoiko-tax -- start
            pm2 save
